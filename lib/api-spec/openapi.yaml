openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Prompt Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Category operations
  - name: prompts
    description: Prompt operations
  - name: users
    description: User profile operations
  - name: libraries
    description: Prompt library operations
  - name: stats
    description: Marketplace stats
  - name: auth
    description: Auth-aware user operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /categories/{slug}/subcategories:
    get:
      operationId: listSubcategories
      tags: [categories]
      summary: List subcategories for a category
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of subcategories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subcategory"
        "404":
          description: Category not found

  /users/me:
    get:
      operationId: getMyProfile
      tags: [auth]
      summary: Get own profile (requires Clerk auth)
      responses:
        "200":
          description: Own user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Profile not yet created

  /prompts:
    get:
      operationId: listPrompts
      tags: [prompts]
      summary: List prompts with optional filters
      description: "Public catalog. `content` is a truncated preview unless the caller is the author/admin or has purchased the prompt. Full text is also available at GET /prompts/{id}/content after purchase."
      parameters:
        - name: categoryId
          in: query
          schema:
            type: ["integer", "null"]
        - name: subcategoryId
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: sort
          in: query
          schema:
            type: ["string", "null"]
            enum: [trending, newest, most_saved, null]
        - name: username
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptListResponse"
    post:
      operationId: createPrompt
      tags: [prompts]
      summary: Create a new prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptInput"
      responses:
        "201":
          description: Created prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"

  /prompts/trending:
    get:
      operationId: getTrendingPrompts
      tags: [prompts]
      summary: Get trending prompts
      description: "Public catalog. `content` is a truncated preview unless the caller has access (author, admin, or purchase)."
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Trending prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"

  /prompts/{id}:
    get:
      operationId: getPrompt
      tags: [prompts]
      summary: Get a prompt by ID
      description: "Returns metadata plus content. Unpurchased callers receive a truncated preview and isGated=true. Authors, firm admins, and purchasers receive the full body. Use GET /prompts/{id}/content for an explicit paid-content endpoint."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        "404":
          description: Not found
    patch:
      operationId: updatePrompt
      tags: [prompts]
      summary: Update a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptUpdate"
      responses:
        "200":
          description: Updated prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
    delete:
      operationId: deletePrompt
      tags: [prompts]
      summary: Delete a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /prompts/{id}/save:
    post:
      operationId: toggleSavePrompt
      tags: [prompts]
      summary: Toggle save/unsave a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveToggleInput"
      responses:
        "200":
          description: Save status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveToggleResponse"

  /users:
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user profile (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/featured:
    get:
      operationId: getFeaturedCreators
      tags: [users]
      summary: Get featured creators
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Featured creators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get user profile by username
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUserProfile
      tags: [users]
      summary: Update a user profile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{username}/libraries:
    get:
      operationId: getUserLibraries
      tags: [users]
      summary: Get libraries for a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"

  /libraries:
    get:
      operationId: listLibraries
      tags: [libraries]
      summary: List public libraries
      parameters:
        - name: username
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"
    post:
      operationId: createLibrary
      tags: [libraries]
      summary: Create a new library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryInput"
      responses:
        "201":
          description: Created library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"

  /libraries/{id}:
    get:
      operationId: getLibrary
      tags: [libraries]
      summary: Get a library by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Library with prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryDetail"
        "404":
          description: Not found
    patch:
      operationId: updateLibrary
      tags: [libraries]
      summary: Update a library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryUpdate"
      responses:
        "200":
          description: Updated library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
    delete:
      operationId: deleteLibrary
      tags: [libraries]
      summary: Delete a library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /libraries/{id}/prompts:
    post:
      operationId: addPromptToLibrary
      tags: [libraries]
      summary: Add a prompt to a library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryPromptInput"
      responses:
        "200":
          description: Updated library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"

  /libraries/{id}/prompts/{promptId}:
    delete:
      operationId: removePromptFromLibrary
      tags: [libraries]
      summary: Remove a prompt from a library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: promptId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"

  /stats:
    get:
      operationId: getMarketplaceStats
      tags: [stats]
      summary: Get marketplace statistics
      responses:
        "200":
          description: Marketplace stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Subcategory:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
      required:
        - id
        - categoryId
        - name
        - slug
        - description

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
        promptCount:
          type: integer
      required:
        - id
        - name
        - slug
        - icon
        - description
        - sortOrder
        - promptCount

    Prompt:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
          description: "Full prompt body when the caller has access (author, admin, or purchase). Otherwise a ~120 character preview."
        isGated:
          type: boolean
          description: "True when content is a truncated preview because the caller has not purchased and is not the author/admin."
        description:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: string
        subcategoryId:
          type: ["integer", "null"]
        subcategoryName:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        authorUsername:
          type: string
        authorDisplayName:
          type: string
        authorAvatarUrl:
          type: ["string", "null"]
        authorOrgType:
          type: string
          enum: [individual, firm]
        authorOrgName:
          type: ["string", "null"]
        saveCount:
          type: integer
        viewCount:
          type: integer
        isPublic:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - content
        - isGated
        - categoryId
        - categoryName
        - tags
        - authorUsername
        - authorDisplayName
        - authorOrgType
        - saveCount
        - viewCount
        - isPublic
        - createdAt
        - updatedAt

    PromptListResponse:
      type: object
      properties:
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/Prompt"
        total:
          type: integer
      required:
        - prompts
        - total

    PromptInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        description:
          type: string
        categoryId:
          type: integer
        subcategoryId:
          type: ["integer", "null"]
        tags:
          type: array
          items:
            type: string
        authorUsername:
          type: string
        isPublic:
          type: boolean
      required:
        - title
        - content
        - categoryId
        - authorUsername

    PromptUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        description:
          type: string
        categoryId:
          type: integer
        tags:
          type: array
          items:
            type: string
        isPublic:
          type: boolean

    SaveToggleInput:
      type: object
      properties:
        username:
          type: string
      required:
        - username

    SaveToggleResponse:
      type: object
      properties:
        saved:
          type: boolean
        saveCount:
          type: integer
      required:
        - saved
        - saveCount

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        categories:
          type: array
          items:
            type: string
        orgType:
          type: string
          enum: [individual, firm]
        orgName:
          type: ["string", "null"]
        promptCount:
          type: integer
        libraryCount:
          type: integer
        totalSaves:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - username
        - displayName
        - categories
        - orgType
        - promptCount
        - libraryCount
        - totalSaves
        - createdAt

    UserInput:
      type: object
      properties:
        clerkUserId:
          type: string
        username:
          type: string
          minLength: 2
        displayName:
          type: string
          minLength: 1
        bio:
          type: string
        avatarUrl:
          type: string
        categories:
          type: array
          items:
            type: string
        orgType:
          type: string
          enum: [individual, firm]
        orgName:
          type: string
      required:
        - username
        - displayName

    UserUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
        bio:
          type: string
        avatarUrl:
          type: string
        categories:
          type: array
          items:
            type: string

    Library:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        authorUsername:
          type: string
        authorDisplayName:
          type: string
        promptCount:
          type: integer
        previewTitles:
          type: array
          items:
            type: string
        isPublic:
          type: boolean
        kind:
          type: string
          description: "collection for curated sets; saved for bookmarks"
        priceCents:
          type: ["integer", "null"]
          description: Collection price override in cents. Null means use the author's default.
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - authorUsername
        - authorDisplayName
        - promptCount
        - previewTitles
        - isPublic
        - createdAt
        - updatedAt

    LibraryDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        authorUsername:
          type: string
        authorDisplayName:
          type: string
        isPublic:
          type: boolean
        kind:
          type: string
        priceCents:
          type: ["integer", "null"]
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/Prompt"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - authorUsername
        - authorDisplayName
        - isPublic
        - prompts
        - createdAt
        - updatedAt

    LibraryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        authorUsername:
          type: string
        isPublic:
          type: boolean
        kind:
          type: string
          enum: [collection, saved]
      required:
        - name
        - authorUsername

    LibraryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        isPublic:
          type: boolean

    LibraryPromptInput:
      type: object
      properties:
        promptId:
          type: integer
      required:
        - promptId

    MarketplaceStats:
      type: object
      properties:
        totalPrompts:
          type: integer
        totalCreators:
          type: integer
        totalSaves:
          type: integer
        totalLibraries:
          type: integer
        topCategories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - totalPrompts
        - totalCreators
        - totalSaves
        - totalLibraries
        - topCategories
