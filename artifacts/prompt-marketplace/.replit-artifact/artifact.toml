kind = "web"
previewPath = "/"
title = "Prompt Marketplace"
version = "1.0.0"
id = "artifacts/prompt-marketplace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22275

[services.development]
run = "pnpm --filter @workspace/prompt-marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prompt-marketplace", "run", "build" ]
serve = "static"
publicDir = "artifacts/prompt-marketplace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22275"
BASE_PATH = "/"
